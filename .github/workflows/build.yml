name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Gradle test JDK 8
        id: java8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'

      - name: Set up Gradle test JDK 11
        id: java11
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '11'

      - name: Set up Gradle test JDK 17
        id: java17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Zulu JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version-file: .java-version

      - name: Set up ja
        uses: Netflix/ja/.github/actions/setup-ja@v0.22.1

      - name: Test
        env:
          JIG_TEST_GRADLE_JAVA_8_HOME: ${{ steps.java8.outputs.path }}
          JIG_TEST_GRADLE_JAVA_11_HOME: ${{ steps.java11.outputs.path }}
          JIG_TEST_GRADLE_JAVA_17_HOME: ${{ steps.java17.outputs.path }}
        run: ja test --all
