# Maps old Maven artifact coordinates to their canonical successors.
#
# Format: oldGroupId\:oldArtifactId=newGroupId\:newArtifactId
#
# Applied during module name derivation: when an artifact matches an
# old coordinate, the relocation target is used instead. This ensures
# deriveModuleName produces the correct module name regardless of
# which version of the coordinates a POM references.
#
# Only for artifact renames within or across namespaces. Wholesale
# groupId moves (asm -> org.ow2.asm, javassist -> org.javassist) are
# handled by prefix aliases in maven-module-prefix-aliases.properties.
#
# Seeded from netflix/gradle-resolution-rules. Over time, authors
# should publish Maven relocation POMs making these entries unnecessary.

# javax specification API renames (old short name -> qualified name)
javax.annotation\:jsr250-api=javax.annotation:javax.annotation-api
javax.el\:el-api=javax.el:javax.el-api
javax.servlet\:servlet-api=javax.servlet:javax.servlet-api
javax.servlet\:jsp-api=javax.servlet.jsp:javax.servlet.jsp-api
javax.servlet.jsp\:jsp-api=javax.servlet.jsp:javax.servlet.jsp-api
javax.persistence\:persistence-api=jakarta.persistence:jakarta.persistence-api

# Google Collections -> Guava
com.google.collections\:google-collections=com.google.guava:guava
com.google.guava\:guava-jdk5=com.google.guava:guava

# LZ4
net.jpountz.lz4\:lz4=org.lz4:lz4-java
