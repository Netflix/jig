# Maps module namespace prefixes to BOM coordinates for module
# location discovery.
#
# Keys are either:
#   moduleNamespace                      — matches all modules in that namespace
#   moduleNamespace/moduleNamePrefix     — matches modules with that prefix
#
# Values are bomGroupId:bomArtifactId.
# Longest matching key wins.
#
# Only for artifact families — single-artifact mappings belong in
# direct location entries, not BOM aliases.

# Google Guava (guava, failureaccess, guava-testlib)
com.google/com.google.common=com.google.guava:guava-bom

# Spock — artifact abbreviation (spock, not spockframework)
org.spockframework=org.spockframework:spock-bom

# Vert.x
io.vertx=io.vertx:vertx-stack-bom

# JAXB (jaxb-core, jaxb-impl, jaxb-xjc)
com.sun/com.sun.xml.bind=com.sun.xml.bind:jaxb-bom-ext
